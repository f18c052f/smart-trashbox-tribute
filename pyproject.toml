[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prediction-core"
version = "0.1.0"
description = "飛来物体の3D位置サンプル列から床面への落下地点と落下時刻を推定する予測コア"
readme = "README.md"
requires-python = ">=3.11"
# 実行時のサードパーティ依存はゼロ（標準ライブラリのみ）。
# numpy / scipy / pydantic を含め一切追加しないこと。
dependencies = []

[project.optional-dependencies]
sensing = ["numpy>=1.24"]
calibration = ["numpy>=1.24"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_core", "src/sensing_foundation", "src/trajectory_sim", "src/world_frame_calibration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
