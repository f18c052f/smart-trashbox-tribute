; PlatformIO Project Configuration File
;
; drivetrain-core task 1.1: build-skeleton proof. This file is the single
; source of truth for the three build configurations (design.md
; "BuildSkeleton" / requirements.md 1.1, 1.2, 1.5, 1.6, 1.7, 16.7).
;
; - [env:teleop] / [env:production]: classic ESP32, ESP-IDF, C++17, platform
;   pinned to an immutable pioarduino release artifact (requirement 1.7).
;   The exclusivity macro check (build_profile.hpp #error) and radio
;   exclusion from [env:production] are added in task 1.2 — not here.
; - [env:native]: host-only build for the pure logic library, no ESP32
;   peripherals or radio required (requirement 1.5).
;
; https://docs.platformio.org/page/projectconf.html

[env:teleop]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = espidf
build_flags =
    -std=gnu++17
lib_ldf_mode = off
test_filter = embedded/*

[env:production]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = espidf
build_flags =
    -std=gnu++17
lib_ldf_mode = off
test_filter = embedded/*

[env:native]
platform = native
build_flags =
    -std=gnu++17
test_filter = native/*
