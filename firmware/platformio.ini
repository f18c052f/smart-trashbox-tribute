; PlatformIO Project Configuration File
;
; drivetrain-core task 1.1: build-skeleton proof. This file is the single
; source of truth for the three build configurations (design.md
; "BuildSkeleton" / requirements.md 1.1, 1.2, 1.5, 1.6, 1.7, 16.7).
;
; - [env:teleop] / [env:production]: classic ESP32, ESP-IDF, C++17, platform
;   pinned to an immutable pioarduino release artifact (requirement 1.7).
;   task 1.2 adds: the exclusivity macro check (build_profile.hpp #error,
;   requirement 1.3), radio exclusion from [env:production] via
;   sdkconfig.defaults.production (requirement 1.4), and an
;   extra_scripts-set environment variable that firmware/src/CMakeLists.txt
;   uses to exclude the not-yet-existing src/teleop/ source location from
;   the production build. A CMake cache variable (-D via
;   board_build.cmake_extra_args) does NOT work for this last one: ESP-IDF
;   evaluates every component's CMakeLists.txt in a separate `cmake -P`
;   scripting-mode subprocess while gathering component requirements, and
;   that subprocess only receives a fixed whitelist of serialized build
;   properties -- custom cache variables are invisible there (verified
;   empirically). See scripts/set_build_profile_cmake_env.py for the
;   env-var-based mechanism that does survive that subprocess boundary.
; - [env:native]: host-only build for the pure logic library, no ESP32
;   peripherals or radio required (requirement 1.5).
;
; https://docs.platformio.org/page/projectconf.html

[env:teleop]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = espidf
build_flags =
    -std=gnu++17
    -DDRIVETRAIN_BUILD_TELEOP
; extra_scripts sets the DRIVETRAIN_BUILD_TELEOP *environment* variable
; (distinct from the -D compiler macro above) that
; firmware/src/CMakeLists.txt reads via DEFINED ENV{...} to decide whether
; to include src/teleop/*.cpp (task 1.2 teleop-only source selection). See
; scripts/set_build_profile_cmake_env.py for why an environment variable is
; used instead of a CMake cache variable.
; teleop-bringup task 1.1 (requirements.md 1.1, 1.3, 1.5): teleop layers
; sdkconfig.defaults.teleop (Bluetooth Classic enabled + the larger
; partition table) on top of the shared sdkconfig.defaults, using the SAME
; mechanism [env:production] already proves works (see its comment below
; for why the -D form reaches ESP-IDF here but a custom CMake cache
; variable would not). Before this task teleop had no SDKCONFIG_DEFAULTS
; override and fell back to the framework's implicit single-file
; sdkconfig.defaults alone, which left wireless disabled.
; ⚠️ The partition table is specified in BOTH places, and they must name the
; same table:
;   - board_build.partitions below decides the table that is actually
;     GENERATED AND FLASHED. Verified empirically:
;     platforms/espressif32/builder/frameworks/espidf.py:2846 reads
;     `partitions_csv = board.get("build.partitions",
;     "partitions_singleapp.csv")` and never looks at
;     CONFIG_PARTITION_TABLE_FILENAME -- while line 2847 right below it DOES
;     read sdk_config.get("PARTITION_TABLE_OFFSET"), so the omission is a
;     deliberate partial read, not an oversight. With the Kconfig setting
;     alone, `gen_esp32part.py .pio/build/teleop/partitions.bin` decoded to
;     `factory,app,factory,0x10000,1M` -- the large table never reached the
;     artifact.
;   - CONFIG_PARTITION_TABLE_SINGLE_APP_LARGE in sdkconfig.defaults.teleop
;     decides what ESP-IDF's own app-size check believes the app partition
;     is.
; ⚠️ If the two disagree, the failure mode is the hard one: the size check
; passes against 1.5MB while the flashed table is 1MB, so the firmware links
; cleanly and then fails to flash or boot. The agreement is fixed as an
; invariant by tests/firmware/test_firmware_boundaries.py
; (find_partition_table_disagreement).
; ⚠️ This corrects an earlier belief in this repo that PlatformIO INI options
; never reach the espidf path. That is true of src_filter (see the comment in
; firmware/src/CMakeLists.txt) but NOT of board_build.partitions, which is the
; one option the espidf builder does read.
; teleop-bringup task 5.1 (requirements.md 7.1): scripts/fetch_bluepad32.py
; fetches and integrates Bluepad32 + BTstack into firmware/.deps/bluepad32/
; (gitignored, never vendored -- see that script's module docstring and
; firmware/.gitignore) before CMake configure runs, so its
; EXTRA_COMPONENT_DIRS entry in firmware/CMakeLists.txt resolves to a real
; directory by the time ESP-IDF's component search reads it. Idempotent:
; a no-op after the first successful integration. [env:teleop]-only, same
; as set_build_profile_cmake_env.py -- [env:production] never runs this.
extra_scripts =
    pre:scripts/set_build_profile_cmake_env.py
    pre:scripts/fetch_bluepad32.py
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.teleop"
board_build.partitions = partitions_singleapp_large.csv
lib_ldf_mode = off
test_filter = embedded/*

[env:production]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = espidf
build_flags =
    -std=gnu++17
    -DDRIVETRAIN_BUILD_PRODUCTION
; extra_scripts sets the DRIVETRAIN_BUILD_PRODUCTION environment variable
; (see [env:teleop] comment above) -- firmware/src/CMakeLists.txt uses it
; to exclude src/teleop/ from the production SRCS list (requirement 1.4).
; SDKCONFIG_DEFAULTS is a real ESP-IDF CMake variable (tools/cmake/
; project.cmake), read directly during the top-level project() call rather
; than inside the component-requirements subprocess, so the -D form works
; here: it overrides the framework's implicit single-file sdkconfig.defaults
; fallback with an explicit, semicolon-separated list, letting production
; layer sdkconfig.defaults.production (radio disabled) on top of the shared
; sdkconfig.defaults.
extra_scripts = pre:scripts/set_build_profile_cmake_env.py
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.production"
lib_ldf_mode = off
test_filter = embedded/*

[env:native]
platform = native
build_flags =
    -std=gnu++17
test_filter = native/*
